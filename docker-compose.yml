services:
  postgres:
    image: postgres:16
    container_name: vueladata_pg_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data   # los datos sobreviven si apagas el contenedor

volumes:
  pg_data: